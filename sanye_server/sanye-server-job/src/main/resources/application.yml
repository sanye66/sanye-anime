server:
  port: 8088

spring:
  config:
    import: optional:classpath:feign-defaults.yml,optional:classpath:monitoring.yml
  application:
    name: sanye-server-job
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/sanye_anime}
    username: ${DB_USERNAME:sanye}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  flyway:
    enabled: true
    schemas: sanye_job
    create-schemas: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          jobSearchClient:
            connect-timeout: 3000
            read-timeout: ${SANYE_JOB_REINDEX_TIMEOUT_MS:300000}
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_ENABLED:false}
      config:
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_ENABLED:false}
        file-extension: yaml
        group: BUSINESS_GROUP
        shared-configs:
          - data-id: sanye-common.yaml
            group: COMMON_GROUP
            refresh: true
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}

sanye:
  manage:
    internal-token: ${SANYE_INTERNAL_CALL_TOKEN:}
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    admin-addresses: ${XXL_JOB_ADMIN_ADDRESSES:}
    access-token: ${XXL_JOB_ACCESS_TOKEN:}
    appname: ${XXL_JOB_EXECUTOR_APPNAME:sanye_job}
    address: ${XXL_JOB_EXECUTOR_ADDRESS:}
    ip: ${XXL_JOB_EXECUTOR_IP:}
    port: ${XXL_JOB_EXECUTOR_PORT:9999}
    log-path: ${XXL_JOB_LOG_PATH:./logs/xxl-job}
    log-retention-days: ${XXL_JOB_LOG_RETENTION_DAYS:30}
