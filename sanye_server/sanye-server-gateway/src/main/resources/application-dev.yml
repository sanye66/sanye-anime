server:
  port: 8080

spring:
  application:
    name: sanye-server-gateway
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    sentinel:
      enabled: false
    gateway:
      routes:
        - id: auth
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**,/api/v1/system/**,/api/v1/users/me,/api/v1/monitor/**
        - id: anime
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/anime/**,/api/v1/home,/api/v1/schedule/**,/api/v1/public/**
        - id: search
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/search/**
        - id: ai
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/ai/**
        - id: favorite
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/users/me/favorites/**,/api/v1/users/me/favorites,/api/v1/users/me/history,/api/v1/users/me/history/**
        - id: file
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/files/**
        - id: feedback
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/feedback/**
        - id: admin
          uri: http://localhost:8089
          predicates:
            - Path=/api/v1/admin/**
          filters:
            - StripPrefix=3
        - id: covers
          uri: http://localhost:8082
          predicates:
            - Path=/covers/**
