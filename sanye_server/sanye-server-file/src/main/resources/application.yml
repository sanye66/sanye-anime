server:
  port: 8086

spring:
  config:
    import: optional:classpath:feign-defaults.yml,optional:classpath:monitoring.yml
  application:
    name: sanye-server-file
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:15432/sanye_anime}
    username: ${DB_USERNAME:sanye}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB
  flyway:
    enabled: true
    schemas: sanye_file
    create-schemas: true
    locations: classpath:db/migration
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:}
      password: ${NACOS_PASSWORD:}
      discovery:
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_ENABLED:false}
      config:
        namespace: ${NACOS_NAMESPACE:}
        enabled: ${NACOS_ENABLED:false}
        file-extension: yaml
        group: BUSINESS_GROUP
        shared-configs:
          - data-id: sanye-common.yaml
            group: COMMON_GROUP
            refresh: true
    sentinel:
      enabled: ${SENTINEL_ENABLED:false}

sanye:
  file:
    schema: ${FILE_SCHEMA:sanye_file}
    storage-dir: ${FILE_STORAGE_DIR:./sanye_deploy/.local/files}
