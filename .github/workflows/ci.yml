name: ci

on:
  push:
    branches: ["feature-*", "dev", "test", "release"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文档一致性检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.5.0
      - name: 检查 Markdown 链接与当前事实
        run: node sanye_deploy/check-docs.mjs
      - name: 发布准备门禁回归
        run: node --test sanye_deploy/release/release.test.mjs
      - name: 网页回归运行器生命周期检查
        run: node --test e2e/run-ci.test.mjs

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 播放策略纯逻辑回归
        run: pnpm test:player-policy
      - name: 管理端会话竞态回归
        run: pnpm test:admin-auth
      - name: 备份恢复安全边界回归
        run: pnpm test:recovery
      - name: 敏感配置扫描器脱敏回归
        run: pnpm test:sensitive-config
      - name: 构建
        run: pnpm build

  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      MAVEN_OPTS: -Duser.timezone=UTC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: microsoft
          # 微软发行版索引当前只提供到 21.0.11（21.0.12 不在索引里），写 21.0.12 会让
          # setup-java 直接失败：No matching version found for SemVer '21.0.12'。
          # 本机工具链仍是 21.0.12，CI 固定 21.0.11，差异见 docs/ci-cd.md §2.2。
          java-version: "21.0.11"
          cache: maven
      - name: 安装固定 Maven 版本
        run: bash sanye_deploy/setup-ci-maven.sh
      - name: sanye_server 编译与测试
        run: mvn -B -f sanye_server/pom.xml test
      - name: sanye_admin_server 编译与测试
        run: mvn -B -f sanye_admin_server/pom.xml test
      - name: 保留后端测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sanye_backend-tests-${{ github.sha }}
          if-no-files-found: warn
          path: |
            sanye_server/**/target/surefire-reports/**
            sanye_server/**/target/failsafe-reports/**
            sanye_admin_server/**/target/surefire-reports/**
            sanye_admin_server/**/target/failsafe-reports/**

  browser-security:
    name: 浏览器安全回归
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium
        run: pnpm --filter @sanye/sanye_e2e exec playwright install --with-deps chromium
      - name: 执行自包含 Playwright 安全回归
        run: |
          log=e2e-browser.log
          if ! pnpm e2e:ci > "$log" 2>&1; then
            grep -nE '✖|^not ok|Error:|ERR_|AssertionError|CI Playwright' "$log" | head -25 | sed 's/^/::error::/' || true
            tail -35 "$log"
            exit 1
          fi
          tail -8 "$log"
      - name: 上传网页回归日志
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sanye_browser-e2e-${{ github.sha }}
          path: e2e-browser.log
          if-no-files-found: ignore

  dependency-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26.5.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: microsoft
          # 微软发行版索引当前只提供到 21.0.11（21.0.12 不在索引里），写 21.0.12 会让
          # setup-java 直接失败：No matching version found for SemVer '21.0.12'。
          # 本机工具链仍是 21.0.12，CI 固定 21.0.11，差异见 docs/ci-cd.md §2.2。
          java-version: "21.0.11"
          cache: maven
      - name: 安装固定 Maven 版本
        run: bash sanye_deploy/setup-ci-maven.sh
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 前端依赖审计
          # 上游没有修复版本的告警必须登记在
        # sanye_deploy/audit-exemptions.json 才放行（含复核期限），其余高危/严重告警阻断。
        run: pnpm audit:deps
      - name: 预填 Maven 依赖缓存
        run: |
          mvn -B -ntp -DskipTests -Djacoco.skip=true -f sanye_server/pom.xml install
          mvn -B -ntp -DskipTests -f sanye_admin_server/pom.xml install
      - name: 文件系统漏洞扫描
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.74.0
          format: json
          output: trivy-report.json
          # 判定交给下一步的 audit-trivy.mjs：与 pnpm 审计共用豁免登记文件，
          # 只有「可升级修复」的高危/严重命中才阻断。
          exit-code: "0"
          ignore-unfixed: false
          scanners: vuln
          severity: HIGH,CRITICAL
      - name: 文件系统漏洞门禁
        run: node sanye_deploy/audit-trivy.mjs --report trivy-report.json --conclusion trivy-conclusion.txt
      - name: 输出漏洞扫描结论
        # 公开仓库不登录读不到作业日志，注解本身又只保留约 10 条：门禁结论早就在
        # 上一步写进了 trivy-conclusion.txt，这里整段打成 ::error:: 注解。
        if: always()
        run: |
          if [ -f trivy-conclusion.txt ]; then
            head -20 trivy-conclusion.txt | sed 's/^/::error::/'
          else
            echo "::error::trivy-conclusion.txt 未生成，漏洞门禁未执行完成"
          fi
      - name: 上传漏洞扫描报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sanye_anime-trivy-${{ github.sha }}
          path: |
            trivy-report.json
            trivy-conclusion.txt
          if-no-files-found: ignore

  secret-scan:
    permissions:
      contents: read
      pull-requests: read
    name: 密钥与敏感信息扫描
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Gitleaks 扫描
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
