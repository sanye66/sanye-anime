name: ci

on:
  push:
    branches: ["feature-*", "dev", "test", "release"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: 文档一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
      - name: 检查 Markdown 链接与当前事实
        run: node sanye_deploy/check-docs.mjs
      - name: 发布准备门禁回归
        run: node --test sanye_deploy/release/release.test.mjs

  frontend:
    name: 前端类型检查与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 管理端会话竞态回归
        run: pnpm test:admin-auth
      - name: 备份恢复安全边界回归
        run: pnpm test:recovery
      - name: 敏感配置扫描器脱敏回归
        run: pnpm test:sensitive-config
      - name: 桌面运行边界与签名流程回归
        run: pnpm test:desktop
      - name: 构建
        run: pnpm build

  backend:
    name: 后端编译与测试
    runs-on: ubuntu-latest
    env:
      MAVEN_OPTS: -Duser.timezone=UTC
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "21.0.11"
          cache: maven
      - name: 安装固定 Maven 版本
        run: bash sanye_deploy/setup-ci-maven.sh
      - name: sanye_server 编译与测试
        run: mvn -B -f sanye_server/pom.xml test
      - name: sanye_admin_server 编译与测试
        run: mvn -B -f sanye_admin_server/pom.xml test

  browser-security:
    name: 浏览器安全回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
          cache: pnpm
      - name: 安装依赖
        run: pnpm install --frozen-lockfile
      - name: 安装 Chromium
        run: pnpm --filter @sanye/sanye_e2e exec playwright install --with-deps chromium
      - name: 执行自包含 Playwright 安全回归
        run: pnpm e2e:ci

  dependency-scan:
    name: 依赖漏洞扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.15.0
      - uses: actions/setup-node@v7
        with:
          node-version: 26.5.0
      - uses: actions/setup-java@v6
        with:
          distribution: microsoft
          java-version: "21.0.11"
          cache: maven
      - name: 安装固定 Maven 版本
        run: bash sanye_deploy/setup-ci-maven.sh
      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile
      - name: 前端依赖审计
        run: pnpm audit --audit-level high
      - name: 预填 Maven 依赖缓存
        run: |
          mvn -B -ntp -DskipTests -Djacoco.skip=true -f sanye_server/pom.xml install
          mvn -B -ntp -DskipTests -f sanye_admin_server/pom.xml install
      - name: 文件系统漏洞扫描
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          version: v0.74.0
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL

  secret-scan:
    name: 密钥与敏感信息扫描
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks 扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
