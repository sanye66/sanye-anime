name: desktop-check

on:
  workflow_dispatch:
  # 分支模型是「任务分支 → dev → test → release」直接推送，只在 PR 上跑等于这道门永远不生效，
  # 所以与 ci.yml、android-check.yml 一样加上推送触发（路径过滤保持一致）。
  push:
    branches: ["feature-*", "dev", "test", "release"]
    paths:
      - 'sanye_desktop/**'
      - 'sanye_client/**'
      - 'sanye_server/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-check.yml'
  pull_request:
    paths:
      - 'sanye_desktop/**'
      - 'sanye_client/**'
      - 'sanye_server/**'
      - 'patches/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop-check.yml'

concurrency:
  group: desktop-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-check:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.15.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: microsoft
          java-version: '21.0.11'
      - name: 安装固定 Maven
        shell: bash
        run: bash sanye_deploy/setup-ci-maven.sh
      - run: pnpm install --frozen-lockfile
      - name: 安装桌面托盘回归所需的 Chromium
        run: pnpm --filter @sanye/sanye_e2e exec playwright install chromium
      - name: 桌面回归
        # 同 android-check：失败用例打成 ::error:: 注解，便于公开仓库直接定位。
        run: |
          log=desktop-check.log
          if ! pnpm test:desktop > "$log" 2>&1; then
            grep -E '^(not ok|✖)' "$log" | head -30 | sed 's/^/::error::/' || true
            tail -40 "$log"
            exit 1
          fi
      - name: 上传桌面回归日志
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanye_desktop-test-${{ github.sha }}
          path: desktop-check.log
          if-no-files-found: ignore
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm --filter @sanye/sanye_client build:desktop
      - name: 验证桌面服务源码
        run: mvn -B -ntp -f sanye_server/pom.xml -pl sanye-server-anime,sanye-server-search,sanye-server-favorite -am package
      - name: 保留测试报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanye_desktop-source-check-${{ github.sha }}
          path: sanye_server/**/target/surefire-reports/*.xml
          if-no-files-found: warn
