name: android-check

on:
  workflow_dispatch:
  # 分支模型是「任务分支 → dev → test → release」直接推送，安卓门禁只在 PR 上跑等于没跑
  # （dev/test/release 的推送都过不了这道门），所以与 ci.yml 一样加上推送触发。
  push:
    branches: ["feature-*", "dev", "test", "release"]
    paths:
      - 'sanye_client/**'
      - 'sanye_android/**'
      - 'e2e/**'
      - 'product/android-requirements.md'
      - 'docs/android-development-plan.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      # 交付资源一致性门禁自身的改动也要跑这道门（只改脚本时否则不会触发）。
      - 'sanye_deploy/verify-android-assets.mjs'
      - 'sanye_deploy/verify-android-assets.test.mjs'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'sanye_client/**'
      - 'sanye_android/**'
      - 'e2e/**'
      - 'product/android-requirements.md'
      - 'docs/android-development-plan.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'sanye_deploy/verify-android-assets.mjs'
      - 'sanye_deploy/verify-android-assets.test.mjs'
      - '.github/workflows/android-check.yml'

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.15.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: microsoft
          # 微软发行版索引只提供到 21.0.11，21.0.12 会让 setup-java 直接失败（见 docs/ci-cd.md §2.2）。
          java-version: '21.0.11'
      - run: pnpm install --frozen-lockfile
      - name: 构建安卓前端
        run: pnpm --filter @sanye/sanye_client build:android
      - name: 安装 Playwright Chromium
        run: pnpm --filter @sanye/sanye_e2e exec playwright install --with-deps chromium
      - name: 播放策略纯逻辑回归
        run: pnpm test:player-policy
      - name: 内容源候选与异步播放纯逻辑回归
        run: node --test sanye_android/sourceCandidates.test.cjs e2e/android-history-race.test.cjs e2e/android-playback-warmup.test.cjs e2e/android-source-identity-sqlite.test.cjs e2e/android-source-binding-migration.test.cjs
      - name: 订阅管理交互回归
        env:
          SANYE_SUBSCRIPTION_PLATFORM: android
        run: node --test e2e/subscription-manager.test.cjs
      - name: 订阅仓库真实切换与封面回归
        run: node --test e2e/android-repository-source.test.cjs e2e/android-subscription-source.test.cjs e2e/android-repository-contract.test.cjs
      - name: 安卓备份、离线下载、系统播放与观测回归
        run: node --test --test-concurrency=2 e2e/android-cover-cache.test.cjs e2e/android-experience.test.cjs e2e/android-personal-backup.test.cjs e2e/android-backup-ui.test.cjs e2e/android-system-playback.test.cjs e2e/android-downloads.test.cjs e2e/android-download-playback.test.cjs e2e/android-playback-tools.test.cjs
      - name: 安卓 Media3 会话与来源续播回归
        run: node --test e2e/android-native-playback.test.cjs e2e/android-front-experience.test.cjs e2e/android-search-memory.test.cjs e2e/android-resolve-cache.test.cjs
      - name: 安卓前端回归（隔离桥接）
        # 失败时把 TAP 的 not ok 行打成 ::error:: 注解：公开仓库不登录也能通过
        # check-runs/{id}/annotations 读到失败用例名，否则只剩 "exit code 1"。
        run: |
          log=e2e-android.log
          if ! node --test --test-reporter=tap e2e/player-policy.test.mjs e2e/android-ui.test.cjs e2e/android-media-source.test.cjs e2e/android-catalog-snapshot.test.cjs e2e/android-schedule.test.mjs e2e/android-bundled-fallback.test.cjs e2e/android-episode-order.test.cjs e2e/android-search-retry.test.cjs e2e/android-player-preferences.test.cjs e2e/android-player-stability.test.cjs e2e/android-enhancement-tiers.test.cjs e2e/android-ui-polish.test.cjs e2e/android-theme-parity.test.cjs e2e/android-button-response.test.cjs e2e/android-playback-resilience.test.cjs > "$log" 2>&1; then
            grep -E '^not ok' "$log" | head -30 | sed 's/^/::error::/' || true
            tail -40 "$log"
            exit 1
          fi
      - name: 上传安卓前端回归日志
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanye_android-e2e-${{ github.sha }}
          path: e2e-android.log
          if-no-files-found: ignore
      - name: 同步原生工程
        working-directory: sanye_android
        run: npm ci && npm run sync
      - name: 校验包内页面资源与前端构建一致
        # 交付链路的坑：只跑 build:android + gradle 而不跑 cap sync，包内 assets/public 会停在
        # 上一次同步（本轮本地交付就发出过一个带 2026-09-30 旧资源的中间产物）。这里逐文件
        # 比对文件名与 SHA-256，忽略 Capacitor 生成的 cordova.js / cordova_plugins.js。
        run: |
          pnpm test:verify-android-assets
          pnpm verify:android-assets
      - name: 原生构建、单元测试与静态检查
        working-directory: sanye_android/android
        # lintDebug 是新增门禁：异常兜底、无效资源与废弃 API 这类问题单元测试看不到，
        # 而 app/lint.xml 已经登记了少量误报（详见该文件注释）。
        # 仓库从 Windows 提交，干净检出上 gradlew 没有可执行位，直接 ./gradlew 会以
        # exit 126 结束；先补权限再按本地一致的方式执行。
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:assembleRelease :app:testDebugUnitTest :app:lintDebug :app:lintRelease
      - name: 保留测试与检查报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanye_android-check-${{ github.sha }}
          path: |
            sanye_android/android/app/build/test-results/testDebugUnitTest/*.xml
            sanye_android/android/app/build/reports/lint-results-*.txt
            sanye_android/android/app/build/reports/lint-results-*.html
          if-no-files-found: warn
