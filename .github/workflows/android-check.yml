name: android-check

on:
  workflow_dispatch:
  # 分支模型是「任务分支 → dev → test → release」直接推送，安卓门禁只在 PR 上跑等于没跑
  # （dev/test/release 的推送都过不了这道门），所以与 ci.yml 一样加上推送触发。
  push:
    branches: ["feature-*", "dev", "test", "release"]
    paths:
      - 'sanye_client/**'
      - 'sanye_android/**'
      - 'e2e/**'
      - 'product/android-requirements.md'
      - 'docs/android-development-plan.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-check.yml'
  pull_request:
    paths:
      - 'sanye_client/**'
      - 'sanye_android/**'
      - 'e2e/**'
      - 'product/android-requirements.md'
      - 'docs/android-development-plan.md'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/android-check.yml'

concurrency:
  group: android-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  android-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 26.5.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 10.15.0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: microsoft
          java-version: '21.0.12'
      - run: pnpm install --frozen-lockfile
      - name: 构建安卓前端
        run: pnpm --filter @sanye/sanye_client build:android
      - name: 安装 Playwright Chromium
        run: pnpm --filter @sanye/sanye_e2e exec playwright install --with-deps chromium
      - name: 播放策略纯逻辑回归
        run: pnpm test:player-policy
      - name: 安卓前端回归（隔离桥接）
        run: node --test e2e/player-policy.test.mjs e2e/android-ui.test.cjs e2e/android-media-source.test.cjs e2e/android-catalog-snapshot.test.cjs e2e/android-schedule.test.mjs e2e/android-bundled-fallback.test.cjs e2e/android-episode-order.test.cjs e2e/android-search-retry.test.cjs e2e/android-player-preferences.test.cjs e2e/android-player-stability.test.cjs e2e/android-enhancement-tiers.test.cjs e2e/android-ui-polish.test.cjs e2e/android-theme-parity.test.cjs e2e/android-button-response.test.cjs e2e/android-playback-resilience.test.cjs
      - name: 同步原生工程
        working-directory: sanye_android
        run: npm ci && npm run sync
      - name: 原生构建、单元测试与静态检查
        working-directory: sanye_android/android
        # lintDebug 是新增门禁：异常兜底、无效资源与废弃 API 这类问题单元测试看不到，
        # 而 app/lint.xml 已经登记了少量误报（详见该文件注释）。
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: 保留测试与检查报告
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sanye_android-check-${{ github.sha }}
          path: |
            sanye_android/android/app/build/test-results/testDebugUnitTest/*.xml
            sanye_android/android/app/build/reports/lint-results-*.txt
            sanye_android/android/app/build/reports/lint-results-*.html
          if-no-files-found: warn
