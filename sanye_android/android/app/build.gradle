apply plugin: 'com.android.application'

/**
 * 交付包签名（VQ-62）：仓库里不放 keystore 与口令，签名材料从本地属性或环境变量读取。
 *
 * `gradle.properties`（不入库）或环境变量提供任意一组即可：
 *   SANYE_RELEASE_STORE_FILE / SANYE_RELEASE_STORE_PASSWORD
 *   SANYE_RELEASE_KEY_ALIAS  / SANYE_RELEASE_KEY_PASSWORD
 *
 * 缺少签名材料时 release 仍然可以构建（产物是 `app-release-unsigned.apk`），
 * 只是不能直接安装到真机上：以前的交付包因此只能用 debug 变体，而 debug 变体
 * 自带 android:debuggable=true（可 run-as 读本地库，并自动打开 WebView 远程调试）。
 */
def releaseStoreFile = project.findProperty('SANYE_RELEASE_STORE_FILE') ?: System.getenv('SANYE_RELEASE_STORE_FILE')
def releaseStorePassword = project.findProperty('SANYE_RELEASE_STORE_PASSWORD') ?: System.getenv('SANYE_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = project.findProperty('SANYE_RELEASE_KEY_ALIAS') ?: System.getenv('SANYE_RELEASE_KEY_ALIAS')
def releaseKeyPassword = project.findProperty('SANYE_RELEASE_KEY_PASSWORD') ?: System.getenv('SANYE_RELEASE_KEY_PASSWORD')
def hasReleaseSigning = releaseStoreFile && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

// 正式发行的显式入口；本地无签名候选构建仍保留，不能冒充可安装发布包。
tasks.register('verifyReleaseSigning') {
    doLast {
        if (!hasReleaseSigning || !file(releaseStoreFile).isFile()) {
            throw new GradleException('正式发行需要完整的 SANYE_RELEASE 签名材料，未签名候选不可发布')
        }
    }
}
tasks.register('assembleSignedRelease') {
    dependsOn 'verifyReleaseSigning', 'assembleRelease'
}
tasks.configureEach { task ->
    if (task.name == 'assembleRelease') task.mustRunAfter 'verifyReleaseSigning'
}

android {
    namespace = "com.sanye.sanye_anime"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sanye.sanye_anime"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // 新增风车动漫和动漫共和国订阅，递增版本以区分桌面旧安装包。
        versionCode 55
        versionName "6.4"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    // AGP 8 起 aaptOptions 已废弃，等价配置移到这里。
    androidResources {
        // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
        // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
        ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }
    buildTypes {
        release {
            // 交付包必须开混淆与资源压缩（VQ-62）：此前 minifyEnabled false，
            // 实测 release dex 7,668,792 字节、debug dex 9,432,940 字节（占 APK 76%）。
            // Capacitor 通过 consumerProguardFiles 保留插件类与 @PluginMethod，jsoup/gson 无需额外规则。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) signingConfig signingConfigs.release
        }
    }
    lint {
        // AppTheme.NoActionBar 由 Capacitor 的 BridgeActivity 在运行时 setTheme(R.style.AppTheme_NoActionBar)
        // 引用（编译期解析到库里的同名资源），lint 会误报「未使用」；删掉它会让窗口底色与挖孔设置失效。
        lintConfig file('lint.xml')
        abortOnError true
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'com.google.code.gson:gson:2.11.0'
    implementation 'androidx.media3:media3-exoplayer:1.8.0'
    implementation 'androidx.media3:media3-exoplayer-hls:1.8.0'
    implementation 'androidx.media3:media3-ui:1.8.0'
    implementation 'androidx.media3:media3-session:1.8.0'
    implementation 'androidx.media3:media3-datasource-okhttp:1.8.0'
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
