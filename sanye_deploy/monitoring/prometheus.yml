global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - prometheus-rules.yml

scrape_configs:
  - job_name: sanye-gateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8091"]
        labels:
          app: sanye-gateway
  - job_name: sanye-auth
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8081"]
        labels:
          app: sanye-auth
  - job_name: sanye-anime
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8082"]
        labels:
          app: sanye-anime
  - job_name: sanye-search
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8083"]
        labels:
          app: sanye-search
  - job_name: sanye-ai-chat
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8084"]
        labels:
          app: sanye-ai-chat
  - job_name: sanye-favorite
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8085"]
        labels:
          app: sanye-favorite
  - job_name: sanye-file
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8086"]
        labels:
          app: sanye-file
