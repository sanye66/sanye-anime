server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    location = /healthz { access_log off; return 200 'ok'; }
    location /api/ {
        proxy_pass http://sanye_gateway:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /covers/ { proxy_pass http://sanye_gateway:8080; }
    location /admin-profile/ { proxy_pass http://sanye_gateway:8080; }
    location /assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
